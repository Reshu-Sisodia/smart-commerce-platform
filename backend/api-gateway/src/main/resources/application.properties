server.port=8080
spring.application.name=api-gateway
# ---------- Eureka ----------
# Where to find the Eureka server so we can register ourselves
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

## ---------- Route 1: simple passthrough to httpbin ----------
## Unique route id (just a label)
#spring.cloud.gateway.routes[0].id=httpbin-test
## Target upstream — where the request gets forwarded to
#spring.cloud.gateway.routes[0].uri=https://httpbin.org
## Match any path starting with /httpbin/**
#spring.cloud.gateway.routes[0].predicates[0]=Path=/httpbin/**
# Strip the first path segment before forwarding (/httpbin/get -> /get)
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# ---------- Route 2: passthrough + custom header ----------
# Another route id
spring.cloud.gateway.routes[1].id=httpbin-with-header
# Same upstream target
spring.cloud.gateway.routes[1].uri=https://httpbin.org
# Match any path starting with /httpbin2/**
spring.cloud.gateway.routes[1].predicates[0]=Path=/httpbin2/**
# Strip the first path segment
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1
# Add a custom header to the forwarded request
spring.cloud.gateway.routes[1].filters[1]=AddRequestHeader=X-Gateway,smart-commerce

# ---------- Actuator ----------
# Expose selected actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info,gateway
# Show full health details (db, eureka, etc.)
management.endpoint.health.show-details=always

# ---------- Logging ----------
# Reduce Spring Cloud Gateway noise; set to DEBUG when troubleshooting routing
logging.level.org.springframework.cloud.gateway=INFO
spring.cloud.config.enabled=false
management.endpoint.gateway.enabled=true

# ---------- Route: user-service ----------
# Route id (label for logs/actuator)
spring.cloud.gateway.routes[0].id=user-service
# lb:// -> look up "user-service" in Eureka and load-balance across instances
spring.cloud.gateway.routes[0].uri=lb://user-service
# Match any path starting with /api/v1/users/**
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/users/**